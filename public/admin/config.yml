backend:
  name: github
  repo: RAD-DESIGNZ/rad-designz
  branch: main

publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{client}}, {{year}}"
    sortable_fields: ["order", "year", "title"]
    fields:
      - { name: "title", label: "Project title", widget: "string" }
      - { name: "year", label: "Year", widget: "number", value_type: "int", min: 2000, max: 2100, default: 2026 }
      - { name: "client", label: "Client", widget: "string", default: "Personal" }
      - name: "category"
        label: "Discipline"
        widget: "select"
        options:
          - { label: "Brand identity", value: "branding" }
          - { label: "Logo", value: "logo" }
          - { label: "Packaging", value: "packaging" }
          - { label: "Creative direction", value: "creative-direction" }
      - { name: "summary", label: "Short description", widget: "text", hint: "One or two sentences. Shown under the title." }
      - { name: "cover", label: "Cover image", widget: "image", hint: "Max 2000px wide, under 500KB, JPG." }
      - { name: "gallery", label: "Gallery", widget: "list", field: { name: "image", label: "Image", widget: "image" }, required: false }
      - { name: "tools", label: "Tools", widget: "list", required: false }
      - { name: "link", label: "External link", widget: "string", required: false }
      - { name: "featured", label: "Show on homepage", widget: "boolean", default: false }
      - { name: "order", label: "Sort order", widget: "number", value_type: "int", default: 100, hint: "Lower numbers appear first." }
      - { name: "body", label: "Case study", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About us"
        file: "src/content/pages/about.md"
        fields:
          - { name: "heading", label: "Page heading", widget: "string" }
          - { name: "lede", label: "Opening paragraph", widget: "text" }
          - { name: "panel_title", label: "Side box title", widget: "string", required: false }
          - { name: "panel_items", label: "Side box list", widget: "list", required: false }
          - { name: "body", label: "Main text", widget: "markdown" }

      - name: "contact"
        label: "Contact"
        file: "src/content/pages/contact.md"
        fields:
          - { name: "heading", label: "Page heading", widget: "string" }
          - { name: "lede", label: "Opening paragraph", widget: "text" }
          - { name: "email", label: "Email address", widget: "string" }
          - { name: "instagram", label: "Instagram URL", widget: "string", required: false }
          - { name: "behance", label: "Behance URL", widget: "string", required: false }
          - { name: "linktree", label: "Linktree URL", widget: "string", required: false }
          - { name: "panel_title", label: "Side box title", widget: "string", required: false }
          - { name: "panel_items", label: "Side box list", widget: "list", required: false }
          - { name: "body", label: "Unused", widget: "hidden", default: "" }
