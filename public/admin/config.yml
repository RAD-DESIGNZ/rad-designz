backend:
  name: github
  repo: RAD-DESIGNZ/rad-designz
  branch: main

publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

# Images are optimised in the browser before upload: converted to WebP,
# resized to fit 2000px, and the filename is slugified.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{client}}, {{year}}"
    sortable_fields: ["order", "year", "title"]
    reorder: { key: "order" }
    fields:
      - { name: "title", label: "Project title", widget: "string" }
      - { name: "year", label: "Year", widget: "number", value_type: "int", min: 2000, max: 2100, default: 2026 }
      - { name: "client", label: "Site", widget: "string", required: false, hint: "A domain like domnulics.ro. Leave empty if the project has no site." }
      - name: "discipline"
        label: "Main discipline (filter)"
        widget: "select"
        hint: "The one filter this project appears under on the Projects page, and the purple subtitle on its card."
        options:
          - { label: "Brand identity", value: "branding" }
          - { label: "Logo", value: "logo" }
          - { label: "Packaging", value: "packaging" }
          - { label: "UI/UX & web", value: "ui-web" }
          - { label: "Visual & social media", value: "visual-social" }
      - name: "category"
        label: "Disciplines (tags on project page)"
        widget: "select"
        multiple: true
        min: 1
        hint: "Every discipline this project involved. Shown on the project page only."
        options:
          - { label: "Brand identity", value: "branding" }
          - { label: "Logo", value: "logo" }
          - { label: "Packaging", value: "packaging" }
          - { label: "Creative direction", value: "creative-direction" }
          - { label: "Print design", value: "print" }
          - { label: "UI/UX design", value: "ui-ux" }
          - { label: "Visual design", value: "visual" }
          - { label: "Illustration", value: "illustration" }
          - { label: "Web design", value: "web" }
          - { label: "Social media design", value: "social-media" }
          - { label: "Editorial design", value: "editorial" }
      - { name: "summary", label: "Short description", widget: "text", hint: "One or two sentences. Shown under the title." }
      - { name: "cover", label: "Cover image", widget: "image", hint: "Any size — it is resized and converted automatically on upload." }
      - { name: "cover_animated", label: "Animated cover (optional)", widget: "image", required: false, hint: "Animated WebP that plays once when the card appears. Leave empty for a still cover." }
      - { name: "cover_animated_start", label: "Animated cover — first frame (optional)", widget: "image", required: false, hint: "Still image of the animation's first frame, shown until it starts." }
      - name: "gallery"
        label: "Gallery"
        widget: "image"
        multiple: true
        required: false
        hint: "Drag several images in at once. Drag the handle on the left of each one to reorder."
      - { name: "tools", label: "Tools", widget: "list", required: false }
      - { name: "link", label: "External link", widget: "string", required: false }
      - { name: "featured", label: "Show on homepage", widget: "boolean", default: false }
      - { name: "order", label: "Sort order", widget: "number", value_type: "int", default: 100, hint: "Lower numbers appear first." }
      - { name: "body", label: "Case study", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - name: "about"
        label: "About us"
        file: "src/content/pages/about.md"
        fields:
          - { name: "heading", label: "Page heading", widget: "string" }
          - { name: "lede", label: "Opening paragraph", widget: "text" }
          - { name: "panel_title", label: "Side box title", widget: "string", required: false, hint: "The list underneath is generated from the disciplines automatically." }
          - { name: "body", label: "Main text", widget: "markdown" }

      - name: "contact"
        label: "Contact"
        file: "src/content/pages/contact.md"
        fields:
          - { name: "heading", label: "Page heading", widget: "string" }
          - { name: "lede", label: "Opening paragraph", widget: "text" }
          - { name: "email", label: "Email address", widget: "string" }
          - { name: "behance", label: "Behance URL", widget: "string", required: false, hint: "Shown on the Contact page and as a footer icon." }
          - { name: "facebook", label: "Facebook URL", widget: "string", required: false, hint: "Footer icon only." }
          - { name: "instagram", label: "Instagram URL", widget: "string", required: false, hint: "Footer icon only." }
          - { name: "linktree", label: "Linktree URL", widget: "string", required: false }
          - { name: "panel_title", label: "Side box title", widget: "string", required: false }
          - { name: "panel_items", label: "Side box list", widget: "list", required: false }
          - { name: "body", label: "Unused", widget: "hidden", default: "" }
